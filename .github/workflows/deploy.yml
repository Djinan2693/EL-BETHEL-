name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup Node + pnpm ─────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Build church website ───────────────────────────────────────────────
      - name: Build
        working-directory: artifacts/el-bethel-church
        env:
          PORT: 8080
          BASE_PATH: /
        run: pnpm run build

      # ── 5. Website editor login (/admin) ─────────────────────────────────────
      # Creates admin/secret.php from the ADMIN_USER / ADMIN_PASSWORD repository
      # secrets. Only a bcrypt hash of the password is uploaded, never the
      # password itself. If the secrets are missing, /admin stays switched off.
      - name: Configure website editor login
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::ADMIN_USER / ADMIN_PASSWORD secrets not set - /admin will stay switched off."
            exit 0
          fi
          php -r '
            $u = getenv("ADMIN_USER");
            $h = password_hash(getenv("ADMIN_PASSWORD"), PASSWORD_DEFAULT);
            file_put_contents("artifacts/el-bethel-church/dist/public/admin/secret.php",
              "<?php\n// Generated by GitHub Actions - do not edit.\n"
              . "define(\"ADMIN_USER\", " . var_export($u, true) . ");\n"
              . "define(\"ADMIN_PASSWORD_HASH\", " . var_export($h, true) . ");\n");
          '
          php -l artifacts/el-bethel-church/dist/public/admin/secret.php

      # ── 6. Deploy dist/public → cPanel via FTP ────────────────────────────────
      - name: Deploy to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.pilseasy-logistique.fr
          username: push@ebchristianfellowship.org
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: artifacts/el-bethel-church/dist/public/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
